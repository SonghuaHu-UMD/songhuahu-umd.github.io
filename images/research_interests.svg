<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 458" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="s" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ===== HOW THIS FIGURE IS BUILT =====
       A long detail line wraps onto a second line instead of pushing the canvas wider. That
       is the rule that keeps this readable: the canvas had crept from 960 to 1060 chasing
       one long line, and since the page renders it at a fixed 1100, every widening was paid
       for in rendered type size. Wrapping spends height instead, which the page has.

       So the cards are sized for a title plus two detail lines, and METHODS and
       APPLICATIONS use both of them on every card: two short lines scan faster than one
       long one, and the room means no term has to be abbreviated to fit. DATA SOURCES
       keeps one line, its labels being short enough that a second would be padding, and
       each card centres whatever it actually carries.

       Inside a card the title sits further from the first detail line (23, or 24 in the
       taller cards) than the detail lines sit from each other (17, or 18). Equal gaps read
       as three lines of one paragraph; the wider first gap is what makes the title read as
       a heading over them.

       Every column spans exactly 55..439: the five card columns run 72 high on a 78 pitch,
       the four card column 90 on a 98 pitch. Card titles follow that size (15 and 16);
       every detail line in the figure is 13, so the second line of a card reads the same
       everywhere however tall the card around it is.

       Column widths are set by the longest unbreakable phrase, not by symmetry: 210 for
       DATA SOURCES, whose lines are short, and 304 for the other two.

       In DATA SOURCES the card names where the data comes from and the line under it names
       the data itself, kept to the shortest form that still reads as a data type. Where a
       platform is not a data type it was replaced by what it yields: X, LinkedIn and Google
       Maps became posts, reviews and profiles. Cameras is the deliberate exception, named
       by device.

       The five METHODS cards are mirrored, in the same order, by the sentence that opens
       _pages/about.md. Change one and change the other.

       APPLICATIONS carries the four themes of _pages/Research.md (Mobility, Resilience,
       Sustainability, Health), and every line under them names what is studied, never how,
       in words specific to transport. Both halves of that rule are load bearing: the
       earlier wording repeated the METHODS column back at the reader, and what first
       replaced it would have been true of any field rather than this one.

       Note for future edits: no double hyphen anywhere in these comments. It is illegal
       inside an XML comment, and the page loads this file through <img>, which parses it as
       XML and would drop the whole image. -->

