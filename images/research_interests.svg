  <rect x="25" y="343" width="210" height="66" rx="10" fill="#eef3f0" stroke="#c8d5cd" stroke-width="1" filter="url(#s)"/>
  <text x="130" y="374" text-anchor="middle" fill="#4a6a5a" font-size="15" font-weight="700">Social Media</text>
  <text x="130" y="391" text-anchor="middle" fill="#6f8a7e" font-size="13">Posts · Reviews · Profiles</text>

