name: Refresh Google Scholar metrics

# Reads citations, h-index and i10-index off the Google Scholar profile and commits them
# when they have actually changed.
#
# Requires one repository secret:
#   SERPAPI_KEY — a SerpAPI key (Settings → Secrets and variables → Actions → New repository
#   secret). Weekly means ~4-5 searches a month, well inside the free tier.
#
# Why a paid proxy for a public page: Google Scholar has no API and answers a GitHub runner
# with a flat HTTP 403. That is measured, not assumed -- five spaced attempts from a runner
# were refused every time while the identical code from a residential IP got HTTP 200. So
# reaching Scholar from the cloud means going through egress it does not block. The script
# still reads the page directly when SERPAPI_KEY is absent, which is what makes
# `npm run build:scholar` work on a laptop with nothing configured.
#
# Weekly, on the same day as the publication refresh: Scholar recomputes these numbers
# slowly, so a daily run would mostly commit churn for no benefit.
#
# A failed run never corrupts anything. The script refuses to write unless all three numbers
# parse and pass a sanity check, so the worst case is "this week's numbers are still last
# week's" -- the site keeps serving the last good values.

on:
  schedule:
    # 07:42 UTC Monday = 15:42 Asia/Hong_Kong. Off the hour because scheduled jobs queue
    # behind everyone else's :00 crons, and 90 minutes after the 06:12 publication refresh
    # so the two never race each other pushing to master (the 20:17 visitor map is clear
    # of both).
    - cron: '42 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-scholar-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # No npm install on purpose: fetch-scholar-metrics.js uses only Node builtins and
      # global fetch, so installing devDependencies (sharp, terser) would be dead weight.
      # `shell: bash` is load-bearing, not decoration: the implicit shell is `bash -e`
      # without pipefail, so a failing node would be masked by tee's exit 0 and the run
      # would go green on no data. Naming the shell gets `-eo pipefail`.
      - name: Fetch metrics from Google Scholar
        id: fetch
        shell: bash
        # Absent or empty, the script falls back to reading Scholar directly and will be
        # refused by this runner -- so a missing secret shows up as a failed run with the
        # reason in the log, rather than as silently stale numbers.
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/fetch-scholar-metrics.js | tee /tmp/scholar.log

      # Turn the bare red X into something actionable: the likely causes are all operational
      # (key, quota) rather than anything wrong with the code.
      - name: Explain a failed fetch
        if: failure() && steps.fetch.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Google Scholar fetch did not succeed"
            echo ""
            echo 'The committed numbers in `_data/scholar_metrics.json` were left untouched, so the site still shows the last good values.'
            echo ""
            echo "Read the log line above this step; it names the cause:"
            echo ""
            echo '- **`HTTP 401 - Invalid API key`** — the `SERPAPI_KEY` secret is missing, mistyped or revoked.'
            echo '- **`Invalid API key` / quota wording** — the free tier ran out this month; it resets monthly.'
            echo '- **`Source: scholar.google.com directly`** — the secret was not visible to the run, so it fell back to the direct read and Scholar refused this runner (expected: datacenter IPs get HTTP 403).'
            echo '- **`SerpAPI response lacked ...`** — SerpAPI changed its `cited_by.table` shape; the parser in `scripts/fetch-scholar-metrics.js` needs updating.'
            echo ""
            echo 'Stopgap that always works: run `npm run build:scholar` locally (no key needed) and commit `_data/scholar_metrics.json`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if the data changed
        id: commit
        shell: bash
        run: |
          file='_data/scholar_metrics.json'
          if git diff --quiet -- $file; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in Scholar metrics; nothing to commit."
            exit 0
          fi
          cites=$(node -p "require('./_data/scholar_metrics.json').citations")
          h=$(node -p "require('./_data/scholar_metrics.json').h_index")
          i10=$(node -p "require('./_data/scholar_metrics.json').i10_index")
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $file
          git commit -m "chore: refresh Scholar metrics (${cites} citations, h=${h}, i10=${i10})"
          # A human push landing between checkout and here would make this a non-fast-forward.
          # Rebasing onto it is safe: this job only ever touches one generated file, so there
          # is nothing of its own to lose if the rebase drops its commit.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not reliably kick off the Pages build, so ask for
      # one explicitly. Best-effort: if the push already triggered a build, this is a
      # harmless duplicate request and must not fail the run.
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
